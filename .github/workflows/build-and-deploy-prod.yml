name: Build and deploy prod

on:
  release:
    types: [released]

jobs:
  build-and-deploy:
    uses: navikt/hag-workflows/.github/workflows/build-and-deploy.yml@main
    permissions:
      id-token: write
    with:
      environment: prod
      project-id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
    secrets:
      identity-provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
